<!-- PAYMENT METHODS — NO DEMO PAYMENT -->
<div class="payment-modal" id="paymentModal">
    <div class="payment-box">

        <button class="payment-close" onclick="closePayment()">×</button>

        <h2>Choose Payment Method</h2>
        <p>Select a payment app.</p>

        <!-- PHONEPE -->
        <button class="payment-method"
                onclick="paymentSelected('PhonePe')">
            <div class="payment-logo phonepe-logo">पे</div>
            <div>
                <strong>PhonePe</strong>
                <span>UPI payment</span>
            </div>
        </button>

        <!-- GOOGLE PAY -->
        <button class="payment-method"
                onclick="paymentSelected('Google Pay')">
            <div class="payment-logo gpay-logo">
                <span class="g">G</span>
                <span class="pay">Pay</span>
            </div>
            <div>
                <strong>Google Pay</strong>
                <span>UPI payment</span>
            </div>
        </button>

        <!-- PAYTM -->
        <button class="payment-method"
                onclick="paymentSelected('Paytm')">
            <div class="payment-logo paytm-logo">paytm</div>
            <div>
                <strong>Paytm</strong>
                <span>UPI payment</span>
            </div>
        </button>

        <!-- OTHER UPI APPS -->
        <button class="payment-method"
                onclick="paymentSelected('Any UPI App')">
            <div class="payment-logo"
                 style="background:#0f172a;color:white;font-weight:800;font-size:13px;">
                UPI
            </div>
            <div>
                <strong>Other UPI App</strong>
                <span>BHIM, Amazon Pay, bank apps...</span>
            </div>
        </button>

    </div>
</div>


<!-- MANUAL FALLBACK -->
<div class="payment-modal" id="fallbackModal">
    <div class="payment-box">

        <button class="payment-close"
                onclick="closeFallback()">×</button>

        <h2>Pay Manually</h2>

        <p>
            Could not open a UPI app automatically.
            Open PhonePe / Google Pay / Paytm and use these details:
        </p>

        <div style="
            background:#f1f5f9;
            border-radius:12px;
            padding:14px;
            margin:14px 0;
        ">

            <div style="font-size:12px;color:#64748b;">
                Amount
            </div>

            <div id="fbAmount"
                 style="
                    font-size:22px;
                    font-weight:800;
                    margin-bottom:10px;
                 ">
            </div>

            <div style="font-size:12px;color:#64748b;">
                UPI ID
            </div>

            <div id="fbUpi"
                 style="
                    font-size:16px;
                    font-weight:700;
                    word-break:break-all;
                 ">
            </div>

        </div>

        <button class="payment-method"
                onclick="copyText(RECEIVER_UPI_ID,this)"
                style="justify-content:center;">
            Copy UPI ID
        </button>

        <button class="payment-method"
                onclick="copyText(cleanAmount(selectedPaymentAmount),this)"
                style="justify-content:center;">
            Copy Amount
        </button>

        <button class="payment-method"
                onclick="closeFallback();paymentSelected('Any UPI App')"
                style="justify-content:center;">
            Try UPI Chooser Again
        </button>

    </div>
</div>


<script>

let selectedPaymentAmount = "₹9,000";
let selectedPaymentNote = "Loan payment";


/* ================= UPI DETAILS ================= */

const RECEIVER_UPI_ID = "9014674138@ybl";
const RECEIVER_NAME = "Thummeti Vikram";


/* ================= UPI APPS ================= */

const UPI_APPS = {

    "PhonePe": {
        pkg: "com.phonepe.app",
        scheme: "phonepe://pay?"
    },

    "Google Pay": {
        pkg: "com.google.android.apps.nbu.paisa.user",
        scheme: "tez://upi/pay?"
    },

    "Paytm": {
        pkg: "net.one97.paytm",
        scheme: "paytmmp://pay?"
    },

    "Any UPI App": {
        pkg: "",
        scheme: "upi://pay?"
    }

};


/* ================= AMOUNT ================= */

function cleanAmount(amount) {

    const n = parseFloat(
        String(amount).replace(/[^0-9.]/g, "")
    );

    return isNaN(n)
        ? ""
        : n.toFixed(2);

}


/* ================= UPI QUERY ================= */

function buildUpiQuery() {

    const q = {

        pa: RECEIVER_UPI_ID,

        pn: RECEIVER_NAME,

        am: cleanAmount(
            selectedPaymentAmount
        ),

        cu: "INR",

        tn: selectedPaymentNote

    };

    return Object.keys(q)
        .map(function(key) {

            return key + "=" +
                encodeURIComponent(q[key]);

        })
        .join("&");

}


/* ================= LAUNCH APP ================= */

function launchUrl(url) {

    const a = document.createElement("a");

    a.href = url;

    a.style.display = "none";

    document.body.appendChild(a);

    a.click();

    setTimeout(function() {

        a.remove();

    }, 500);

}


/* ================= FALLBACK ================= */

function showFallback() {

    document.getElementById(
        "fbAmount"
    ).textContent =
        "₹" + cleanAmount(
            selectedPaymentAmount
        );

    document.getElementById(
        "fbUpi"
    ).textContent =
        RECEIVER_UPI_ID;

    document.getElementById(
        "fallbackModal"
    ).classList.add("show");

}


function closeFallback() {

    document.getElementById(
        "fallbackModal"
    ).classList.remove("show");

}


/* ================= COPY ================= */

function copyText(text, btn) {

    function done() {

        const old =
            btn.textContent;

        btn.textContent =
            "Copied ✓";

        setTimeout(function() {

            btn.textContent = old;

        }, 1500);

    }


    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(text)
            .then(done)
            .catch(function() {

                legacyCopy(text);

                done();

            });

    } else {

        legacyCopy(text);

        done();

    }

}


function legacyCopy(text) {

    const t =
        document.createElement(
            "textarea"
        );

    t.value = text;

    t.style.position = "fixed";

    t.style.opacity = "0";

    document.body.appendChild(t);

    t.select();

    try {

        document.execCommand("copy");

    } catch (e) {}

    t.remove();

}


/* ================= OPEN PAYMENT ================= */

function openPayment(
    amount = "₹9,000",
    note = "Loan payment"
) {

    selectedPaymentAmount =
        amount;

    selectedPaymentNote =
        note;

    document.getElementById(
        "paymentModal"
    ).classList.add("show");

}


function closePayment() {

    document.getElementById(
        "paymentModal"
    ).classList.remove("show");

}


/* ================= PAYMENT FLOW ================= */

function paymentSelected(app) {

    closePayment();


    const ua =
        navigator.userAgent;

    const isAndroid =
        /Android/i.test(ua);

    const isIOS =
        /iPhone|iPad|iPod/i.test(ua);


    if (!isAndroid && !isIOS) {

        showFallback();

        return;

    }


    if (!cleanAmount(
        selectedPaymentAmount
    )) {

        alert("Invalid amount.");

        return;

    }


    const query =
        buildUpiQuery();


    const info =
        UPI_APPS[app] ||
        UPI_APPS["Any UPI App"];


    const genericUrl =
        "upi://pay?" + query;


    let firstUrl;


    /* ANDROID */

    if (
        isAndroid &&
        info.pkg
    ) {

        firstUrl =
            "intent://pay?" +
            query +
            "#Intent;scheme=upi;" +
            "package=" +
            info.pkg +
            ";end";

    }

    /* IPHONE / IPAD */

    else if (isIOS) {

        firstUrl =
            info.scheme +
            query;

    }

    /* OTHER */

    else {

        firstUrl =
            genericUrl;

    }


    let appOpened = false;


    function markOpened() {

        appOpened = true;

    }


    document.addEventListener(
        "visibilitychange",
        function() {

            if (document.hidden) {

                markOpened();

            }

        }
    );


    window.addEventListener(
        "pagehide",
        markOpened
    );


    window.addEventListener(
        "blur",
        markOpened
    );


    /*
       IPHONE / IPAD

       Use hidden iframe so Safari
       remains on this page if the
       selected UPI app isn't installed.
    */

    if (isIOS) {

        const frame =
            document.createElement(
                "iframe"
            );

        frame.style.display =
            "none";

        frame.src =
            firstUrl;

        document.body.appendChild(
            frame
        );


        setTimeout(function() {

            frame.remove();


            if (
                appOpened ||
                document.hidden
            ) {

                return;

            }


            showFallback();

        }, 1400);


        return;

    }


    /* ANDROID */

    launchUrl(firstUrl);


    /*
       If selected app didn't open,
       try generic UPI chooser.
    */

    setTimeout(function() {

        if (
            appOpened ||
            document.hidden
        ) {

            return;

        }


        if (
            firstUrl !== genericUrl
        ) {

            launchUrl(
                genericUrl
            );

        }


        /*
           Final fallback
        */

        setTimeout(function() {

            if (
                appOpened ||
                document.hidden
            ) {

                return;

            }


            showFallback();

        }, 2200);


    }, 1800);

}


/* ================= MODAL CLOSE ================= */

document
    .getElementById("paymentModal")
    .addEventListener(
        "click",
        function(e) {

            if (e.target === this) {

                closePayment();

            }

        }
    );

</script>
